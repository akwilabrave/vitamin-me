<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitamin Me</title>
<meta name="theme-color" content="#10151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vitamin Me">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script>
  /* Apply saved theme before first paint (no flash) */
  (function(){ try {
    var t = (JSON.parse(localStorage.getItem('vm.cfg')) || {}).theme || {};
    var mode = t.mode || 'system';
    var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (t.accent) document.documentElement.style.setProperty('--accent', t.accent);
  } catch(e){} })();
</script>
<style>
  :root{
    --accent:#ff8a1f; --accent-ink:#1b1206; --accent2:#20b2a6; --hr:#ef476f; --bad:#e5484d;
    --round: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  }
  [data-theme="dark"]{ --glass:rgba(255,255,255,.06); --glassline:rgba(230,240,250,.42); --bg:#10151c; --panel:#18202a; --line:#243040; --text:#eef2f6; --muted:#8c99a8; --dock:rgba(16,21,28,.9); color-scheme:dark; }
  [data-theme="light"]{ --glass:rgba(255,255,255,.55); --glassline:rgba(19,32,48,.32); --bg:#f2f5f8; --panel:#ffffff; --line:#dbe2ea; --text:#132030; --muted:#5d6b7a; --dock:rgba(242,245,248,.9); color-scheme:light; }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  /* App shell: the page never scrolls, only #view does, so the dock can't drift with iOS rubber-banding */
  /* Pinned to the physical screen edges: iOS home-screen apps report 100vh/100dvh without the status bar */
  body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
  #view{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
    padding:calc(env(safe-area-inset-top) + 14px) max(16px, calc((100% - 608px) / 2)) 28px}
  a{color:inherit}
  button,input{font:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .brand{font-family:var(--round);font-size:30px;font-weight:700;letter-spacing:-.6px;margin:0}
  .brand i{font-style:normal;color:var(--accent)}
  .status{color:var(--muted);font-size:13px;margin:2px 0 18px}
  h2{font-family:var(--round);font-size:19px;font-weight:650;margin:28px 0 10px}

  /* points: the one loud element on the home screen */
  .points{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
  .points .bal{font-family:var(--round);font-size:64px;font-weight:800;line-height:.95;letter-spacing:-2px;color:var(--accent);font-variant-numeric:tabular-nums}
  .points .unit{font-family:var(--round);font-size:18px;font-weight:650;color:var(--muted)}
  .pointsub{color:var(--muted);font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
  .pointsub b{color:var(--text);font-weight:650;font-variant-numeric:tabular-nums}
  .hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .herol{min-width:0}
  .jarbtn{display:flex;flex-direction:column;align-items:center;text-decoration:none;flex:none;margin-top:-4px}
  .jarbtn .jar{width:68px;height:auto}
  .jarbtn .num{font-size:15px;margin-top:-2px}
  .jar{overflow:visible}
  .jarhero{display:flex;align-items:center;gap:20px;margin:6px 0 4px}
  .jarhero .jar.big{width:150px;flex:none}
  .jarcount{font-size:56px;line-height:1;color:var(--text)}
  .jarhero .lbl{color:var(--muted);font-size:14px}
  .jarlast{margin-top:10px;display:flex;align-items:center;gap:6px}
  .jarlast i,.vchip i{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
  #tmap{height:58vh;min-height:320px;border-radius:18px;margin:14px 0 10px;background:var(--panel);overflow:hidden}
  .tview{margin-bottom:6px}
  .ttip{background:var(--panel);color:var(--text);border:1px solid var(--line);font-weight:650;box-shadow:none}
  .ttip::before{display:none}
  .tview button{font-size:13px}
  .stats:has(> :nth-child(4):last-child){grid-template-columns:repeat(2,1fr)}
  .terrcard{display:block;text-decoration:none;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
  .tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tstats .v{font-size:24px}
  .tstats .k{color:var(--muted);font-size:12px}
  .terrcard .btn{text-align:center;margin-top:12px}
  .ghostcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);text-decoration:none}
  .ghostcard .t{display:block;font-weight:650}
  .ghostcard .m{display:block;color:var(--muted);font-size:13px}
  .ghostcard > span:nth-child(2){flex:1;min-width:0}
  .gicon{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--line)}
  .verdict{display:flex;gap:12px;align-items:center;margin:16px 0 4px;padding:14px;border-radius:16px;border:1px solid var(--line)}
  .verdict.win{background:color-mix(in srgb,var(--accent) 14%,var(--panel));border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .verdict.lose{background:var(--panel)}
  .verdict .vt{font-family:var(--round);font-size:21px;font-weight:750;line-height:1.2}
  .verdict .m{color:var(--muted);font-size:13px;margin-top:2px}
  #rmap{height:300px;border-radius:18px;margin:14px 0 10px;background:var(--panel);overflow:hidden}
  .racebar{display:grid;gap:8px}
  .racebar .btn{margin:0}
  .racelive{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:20px}
  .racelive b{color:var(--text)}
  .ahead{color:var(--accent) !important}
  .behind{color:var(--hr) !important}
  .ghostpin{background:none;border:0}
  .seg + .verdict{margin-top:12px}
  .replay{margin-top:12px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
  .replay svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .vbar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden;max-width:150px}
  .vbar i{display:block;height:100%;background:var(--vc)}
  .vit .capsym.locked{fill:var(--vc);opacity:.75}

  /* celebration */
  .celebrate{position:fixed;inset:0;z-index:950;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.45);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fadein .25s ease both}
  .celebrate.out{animation:fadeout .2s ease both}
  .cel-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:22px 22px 18px;text-align:center;
    animation:popin .35s cubic-bezier(.2,.9,.3,1.2) both}
  .cel-card .jar.big{width:170px;margin:0 auto 6px;display:block}
  .cel-title{font-family:var(--round);font-size:28px;font-weight:800;margin:6px 0 10px}
  .cel-one{display:flex;align-items:center;gap:14px;text-align:left}
  .cel-one .capwrap{width:96px;flex:none}
  .cel-one .cap{width:96px}
  .celebrate:focus{outline:none}
  .cel-one .badge{display:none}
  .cel-name{font-family:var(--round);font-size:20px;font-weight:750}
  .cel-one .m,.cel-sub{color:var(--muted);font-size:14px}
  .cel-sub{margin:0 0 10px}
  .cel-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
  .vchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
  .cel-card .btn{margin-top:18px}
  .drop{animation:drop .85s cubic-bezier(.35,0,.45,1) both}
  .lid{transform-box:fill-box;transform-origin:100% 100%}
  .celebrate .lid{animation:lid 2s ease both}
  @keyframes drop{0%{transform:translateY(-150px);opacity:0}12%{opacity:1}68%{transform:translateY(3px)}82%{transform:translateY(-4px)}100%{transform:translateY(0)}}
  @keyframes lid{0%{transform:none}12%,82%{transform:translate(10px,-16px) rotate(24deg)}100%{transform:none}}
  @keyframes popin{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
  @keyframes fadein{from{opacity:0}}
  @keyframes fadeout{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){.drop,.celebrate .lid,.cel-card,.celebrate{animation:none}}
  .chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:13px;color:var(--text)}

  .period{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
  .period .big{font-family:var(--round);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
  .period .big small{font-size:15px;color:var(--muted);font-weight:600;margin-left:3px}
  .period .lbl{color:var(--muted);font-size:13px}
  .capsule{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
  .capsule i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

  .filters{display:grid;gap:10px;margin-bottom:6px}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
  .chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .selects{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .selects label{display:grid;gap:2px;min-width:0}
  .selects span{color:var(--muted);font-size:12px}
  .selects select{width:100%;min-width:0;font:inherit;font-size:14px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 8px;-webkit-appearance:none;appearance:none}
  .listsum{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;color:var(--muted);font-size:13px;padding:8px 0 4px;border-bottom:1px solid var(--line)}
  .listsum b{color:var(--text);font-variant-numeric:tabular-nums}
  .linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0;margin-left:auto}
  .act{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
  .act:last-child{border-bottom:0}
  .thumb{width:64px;height:64px;border-radius:14px;background:var(--panel);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
  .thumb svg{width:52px;height:52px}
  .act .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act .m{color:var(--muted);font-size:13px}
  .act .m span{margin-right:12px;white-space:nowrap}
  .act .r{text-align:right}
  .act .r b{font-family:var(--round);font-size:19px;font-variant-numeric:tabular-nums}
  .act .r div{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .act .r .pts{color:var(--accent);font-family:var(--round);font-weight:700;font-size:15px}

  .back{background:none;border:0;color:var(--accent);padding:6px 0;font-weight:600}
  .title{font-family:var(--round);font-size:26px;font-weight:700;margin:6px 0 2px;line-height:1.15}
  #map{height:260px;border-radius:18px;margin:14px 0;background:var(--panel);overflow:hidden}
  .leaflet-container{background:var(--panel)}
  [data-theme="dark"] .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
  .leaflet-control-attribution.leaflet-control{background:var(--dock);color:var(--muted);font-size:10px}
  .leaflet-control-attribution a{color:var(--muted)}
  .nomap{height:auto !important;padding:26px;text-align:center;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;margin:16px 0}
  .stats .v{font-family:var(--round);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .stats .k{color:var(--muted);font-size:12px}
  .stats .hero{grid-column:1/-1}
  .stats .hero .v{font-size:44px;line-height:1}
  .chart{width:100%;height:auto;display:block}
  .chart text{fill:var(--muted);font-size:11px;font-family:-apple-system,system-ui,sans-serif}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-weight:500;font-size:12px;text-align:right;padding:6px 4px}
  td{text-align:right;padding:8px 4px;border-top:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  .splitbar{display:inline-block;height:6px;border-radius:3px;background:var(--accent2);vertical-align:middle;margin-right:6px}
  .ledger td{padding:9px 4px}
  .ledger td small{display:block;color:var(--muted);font-size:12px}
  .ledger td.p{color:var(--accent);font-weight:650;white-space:nowrap}
  .ledger tr.total td{font-family:var(--round);font-size:19px;font-weight:700}

  .field{margin:12px 0}
  .field label{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
  .field input{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .param{display:grid;grid-template-columns:1fr 84px 52px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .param label{font-size:15px}
  .param input{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums}
  .param input.changed{border-color:var(--accent)}
  .param span{color:var(--muted);font-size:13px}
  .slist{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0}
  .srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px;text-decoration:none;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .srow .t{display:block;font-weight:600}
  .srow .m{display:block;color:var(--muted);font-size:13px}
  .chev{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .grp{color:var(--muted);font-size:14px;font-weight:600;margin:20px 0 2px}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:9px;font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .swatches{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .sw[aria-pressed="true"]{border-color:var(--text)}
  .sw.custom{position:relative;overflow:hidden;background:conic-gradient(#ff5e5e,#ffd23f,#3ddc84,#3d8bfd,#b45cff,#ff5e5e)}
  .sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  .btn{display:block;width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--panel);color:var(--text);font-weight:600;margin-top:10px}
  .btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.danger{color:var(--bad)}
  .hint{color:var(--muted);font-size:13px}
  .hint code{background:var(--panel);padding:1px 5px;border-radius:5px;color:var(--text)}
  .empty{color:var(--muted);text-align:center;padding:36px 12px}
  .empty .btn{max-width:260px;margin:14px auto 0}

  .dock{flex:none;position:relative;display:flex;justify-content:center;gap:8px;
    padding:8px 16px max(8px, calc(env(safe-area-inset-bottom) - 6px));background:var(--dock);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:900}
  .dock button{flex:1;max-width:110px;border:0;border-radius:14px;padding:11px 0;background:var(--panel);color:var(--text);display:grid;place-items:center}
  .dock svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dock button.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.dock button.spin svg{animation:none}}
  .dock button.go{background:var(--accent);color:var(--accent-ink)}
  .dock button[disabled]{opacity:.55}
  .dock button[aria-current]{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}

  /* shop */
  .goal{display:block;text-decoration:none;margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
  .goalrow{display:flex;justify-content:space-between;gap:10px;font-size:15px}
  .goal .lbl{color:var(--muted);font-size:13px;margin-top:6px}
  .num{font-family:var(--round);font-variant-numeric:tabular-nums;font-weight:650}
  .item{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .item .iname{text-decoration:none;min-width:0}
  .item .t{font-weight:600}
  .item .m{color:var(--muted);font-size:13px}
  .item .icost{font-size:18px;color:var(--accent)}
  .item.hist .icost{color:var(--muted)}
  .redeem{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
  .redeem.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .redeem[disabled]{opacity:.45}
  .sug{display:grid;grid-template-columns:26px 1fr 86px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .sug input[type=checkbox],.check input{width:20px;height:20px;accent-color:var(--accent)}
  .sug small{display:block;color:var(--muted);font-size:12px}
  .sugcost{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:right}
  .recs{display:grid;gap:0}
  .rec{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
  .rec:last-child{border-bottom:0}
  .rec .t{font-weight:600}
  .rec .m{color:var(--muted);font-size:13px}
  .rec .rv{font-family:var(--round);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  h2 .count{font-family:-apple-system,system-ui,sans-serif;font-size:14px;font-weight:500;color:var(--muted);margin-left:8px}
  .vits{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px}
  .vit .cap{width:100%;max-width:150px;height:auto;display:block;margin-bottom:8px}
  .capwrap{position:relative;max-width:150px}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--text);color:var(--bg);font-family:var(--round);font-weight:800;font-size:13px;border-radius:999px;padding:2px 8px}
  .vit .capsym{font-family:var(--round);font-size:22px;font-weight:800;fill:var(--muted)}
  .vit .t{font-weight:650}
  .vit .m{color:var(--muted);font-size:13px;line-height:1.35}
  .vit .s{margin-top:4px;color:var(--text);font-variant-numeric:tabular-nums}
  .vit:not(.on) .t{color:var(--muted)}
  .check{display:flex;gap:10px;align-items:center;margin:14px 0;font-size:15px}
  .toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 10px);max-width:608px;margin:0 auto;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);
    opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:1000}
  .toast.on{opacity:1;transform:none}
  .toast.err{border-color:var(--bad)}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
