<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitamin Me</title>
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vitamin Me">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --line:#262d36; --text:#e6edf3; --muted:#8b949e;
    --accent:#ff9f1c; --accent2:#2ec4b6; --bad:#ef476f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 90px)}
  h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.5px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .k{color:var(--muted);font-size:12px}
  .v{font-size:24px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
  .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
  .bar{height:5px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent2);border-radius:3px}
  .chart{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
  .chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .chart b{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
  .chart span{font-size:10px;color:var(--muted);margin-top:4px}
  .wk{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .wk:last-child{border-bottom:0}
  .wk .t{font-weight:600}
  .wk .m{color:var(--muted);font-size:12px}
  .wk .r{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:18px 0}
  .dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);
    background:rgba(13,17,23,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;gap:8px}
  button{font:inherit;border:0;border-radius:12px;padding:12px;font-weight:600;color:var(--text);background:var(--card);
    border:1px solid var(--line);flex:1}
  button.primary{background:var(--accent);color:#111;border-color:var(--accent)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row button{flex:1 1 45%}
  .toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 10px);background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px;opacity:0;transform:translateY(-10px);transition:.25s;pointer-events:none;z-index:9}
  .toast.on{opacity:1;transform:none}
  .toast.err{border-color:var(--bad)}
  textarea{width:100%;height:120px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font:12px ui-monospace,monospace}
  details summary{color:var(--muted);cursor:pointer;margin:6px 0}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:8px}
  .seg button{padding:6px;border:0;background:transparent;font-size:13px;color:var(--muted)}
  .seg button.on{background:var(--line);color:var(--text)}
</style>
</head>
<body>
<h1>Vitamin <span>Me</span></h1>
<div class="sub" id="lastSync">No data yet</div>

<h2 id="dayTitle">Today</h2>
<div class="grid">
  <div class="card"><div class="k">Steps</div><div class="v" id="steps">–</div><div class="bar"><i id="stepsBar"></i></div></div>
  <div class="card"><div class="k">Active energy</div><div class="v" id="energy">–</div><div class="bar"><i id="energyBar"></i></div></div>
  <div class="card"><div class="k">Exercise</div><div class="v" id="exercise">–</div><div class="bar"><i id="exerciseBar"></i></div></div>
  <div class="card"><div class="k">Resting HR</div><div class="v" id="rhr">–</div></div>
</div>

<h2>Last 7 days</h2>
<div class="seg" id="metricSeg">
  <button data-m="steps" class="on">Steps</button>
  <button data-m="energy">Energy</button>
  <button data-m="exercise">Exercise</button>
</div>
<div class="card"><div class="chart" id="chart"></div></div>

<h2>Recent workouts</h2>
<div class="card" id="workouts"><div class="empty">No workouts synced</div></div>

<h2>Data</h2>
<div class="row">
  <button id="btnDemo">Load demo data</button>
  <button id="btnExport">Export backup</button>
  <button id="btnImport">Import backup</button>
  <button id="btnClear">Clear all</button>
</div>
<details>
  <summary>Manual paste (debug)</summary>
  <textarea id="raw" placeholder="Paste Shortcut output here"></textarea>
  <button id="btnParse" style="width:100%;margin-top:8px">Parse pasted text</button>
</details>
<input type="file" id="file" accept="application/json" hidden>

<div class="dock">
  <button id="btnRun">Run sync shortcut</button>
  <button class="primary" id="btnPaste">Paste synced data</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Config ---------- */
const SHORTCUT_NAME = 'Vitamin Me Sync';
const GOALS = { steps: 10000, energy: 500, exercise: 30 };   // daily targets for the progress bars
const STORE_KEY = 'vitaminme.v1';

/* ---------- Storage ---------- */
// Shape: { days: { 'YYYY-MM-DD': {steps, energy, exercise, rhr} }, workouts: { id: {...} }, lastSync }
function load(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || blank(); } catch(e){ return blank(); }
}
function blank(){ return { days:{}, workouts:{}, lastSync:null }; }
function save(s){ try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(e){ toast('Could not save: '+e.message, true); } }
let state = load();

/* ---------- Parser ----------
   Line protocol produced by the Shortcut (pipe-separated, one record per line):
     D|<metric>|<yyyy-MM-dd>|<value>
       metric ∈ steps, energy (kcal), exercise (min), rhr (bpm)
     W|<type>|<start yyyy-MM-dd'T'HH:mm>|<duration min>|<kcal>|<km>
   Unknown or malformed lines are counted and skipped, never fatal. */
const METRICS = new Set(['steps','energy','exercise','rhr']);
function num(x){
  if (x == null) return null;
  // Handles "8432", "8,432", "8 432" (SA), "8.432,5", "32,5", "310 kcal"
  let s = String(x).replace(/[^\d.,-]/g,'');
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.')
      ? s.replace(/\./g,'').replace(',', '.') : s.replace(/,/g,'');
  else if (/^\d{1,3}(,\d{3})+$/.test(s)) s = s.replace(/,/g,'');                    // thousands
  else s = s.replace(',', '.');                                                    // decimal comma
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : null;
}
function isoDay(x){
  const m = String(x||'').match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
}
function parse(text){
  const out = { days:{}, workouts:{}, ok:0, bad:0 };
  for (const rawLine of String(text).split(/\r?\n/)){
    const line = rawLine.trim();
    if (!line) continue;
    const p = line.split('|').map(s => s.trim());
    if (p[0] === 'D' && METRICS.has(p[1])){
      const d = isoDay(p[2]), v = num(p[3]);
      if (!d || v == null){ out.bad++; continue; }
      out.days[d] = out.days[d] || {};
      // Health "group by day" can return several rows per day from different sources; keep the max
      // (sum would double-count watch + phone). rhr is an average, so last value wins.
      out.days[d][p[1]] = p[1] === 'rhr' ? v : Math.max(out.days[d][p[1]] || 0, v);
      out.ok++;
    } else if (p[0] === 'W'){
      const start = p[2] || '';
      if (!isoDay(start)){ out.bad++; continue; }
      const id = (p[1]||'Workout') + '@' + start;
      out.workouts[id] = { type: p[1] || 'Workout', start, min: num(p[3]), kcal: num(p[4]), km: num(p[5]) };
      out.ok++;
    } else out.bad++;
  }
  return out;
}
function merge(parsed){
  for (const [d, vals] of Object.entries(parsed.days)) state.days[d] = { ...(state.days[d]||{}), ...vals };
  Object.assign(state.workouts, parsed.workouts);
  state.lastSync = new Date().toISOString();
  save(state);
}
function ingest(text){
  const p = parse(text);
  if (!p.ok){ toast('No valid records found. Check the Shortcut output.', true); return; }
  merge(p);
  render();
  toast(`Synced ${p.ok} records` + (p.bad ? ` (${p.bad} skipped)` : ''));
}

/* ---------- Rendering ---------- */
const $ = id => document.getElementById(id);
function todayKey(offset=0){
  const d = new Date(); d.setDate(d.getDate()+offset);
  return d.toLocaleDateString('en-CA'); // yyyy-mm-dd in local time
}
function fmt(n, dp=0){ return n == null ? '–' : Number(n).toLocaleString('en-ZA',{maximumFractionDigits:dp}); }
function setBar(id, v, goal){ $(id).style.width = Math.min(100, (v||0)/goal*100) + '%'; }
let chartMetric = 'steps';

function render(){
  const t = state.days[todayKey()] || {};
  $('steps').innerHTML = fmt(t.steps);
  $('energy').innerHTML = t.energy == null ? '–' : `${fmt(t.energy)}<small>kcal</small>`;
  $('exercise').innerHTML = t.exercise == null ? '–' : `${fmt(t.exercise)}<small>min</small>`;
  $('rhr').innerHTML = t.rhr == null ? '–' : `${fmt(t.rhr)}<small>bpm</small>`;
  setBar('stepsBar', t.steps, GOALS.steps);
  setBar('energyBar', t.energy, GOALS.energy);
  setBar('exerciseBar', t.exercise, GOALS.exercise);

  $('lastSync').textContent = state.lastSync
    ? 'Last sync ' + new Date(state.lastSync).toLocaleString('en-ZA',{dateStyle:'medium',timeStyle:'short'})
    : 'No data yet — run the sync shortcut';

  // 7-day chart
  const days = [...Array(7)].map((_,i) => todayKey(i-6));
  const vals = days.map(d => (state.days[d]||{})[chartMetric] || 0);
  const max = Math.max(...vals, 1);
  $('chart').innerHTML = days.map((d,i) => {
    const wd = new Date(d+'T12:00').toLocaleDateString('en-ZA',{weekday:'narrow'});
    return `<div title="${d}: ${fmt(vals[i])}"><b style="height:${vals[i]/max*100}%"></b><span>${wd}</span></div>`;
  }).join('');

  // workouts
  const ws = Object.values(state.workouts).sort((a,b) => b.start.localeCompare(a.start)).slice(0, 10);
  $('workouts').innerHTML = ws.length ? ws.map(w => {
    const when = new Date(w.start.length > 10 ? w.start : w.start+'T00:00');
    const meta = [w.min != null ? fmt(w.min)+' min' : null, w.kcal != null ? fmt(w.kcal)+' kcal' : null,
                  w.km ? fmt(w.km,2)+' km' : null].filter(Boolean).join(' · ');
    return `<div class="wk"><div><div class="t">${esc(w.type)}</div>
      <div class="m">${when.toLocaleString('en-ZA',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>
      <div class="r">${meta}</div></div>`;
  }).join('') : '<div class="empty">No workouts synced</div>';
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let toastTimer;
function toast(msg, err=false){
  const el = $('toast'); el.textContent = msg; el.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = 'toast', 2800);
}

/* ---------- Actions ---------- */
$('btnRun').onclick = () => {
  location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent(SHORTCUT_NAME);
};
$('btnPaste').onclick = async () => {
  try {
    const txt = await navigator.clipboard.readText();
    ingest(txt);
  } catch(e){
    toast('Clipboard blocked — use Manual paste below', true);
    document.querySelector('details').open = true;
  }
};
$('btnParse').onclick = () => ingest($('raw').value);
$('metricSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  chartMetric = b.dataset.m;
  [...$('metricSeg').children].forEach(x => x.classList.toggle('on', x === b));
  render();
};
$('btnDemo').onclick = () => {
  const lines = [];
  for (let i = -13; i <= 0; i++){
    const d = todayKey(i);
    lines.push(`D|steps|${d}|${Math.round(5000 + Math.random()*9000)}`);
    lines.push(`D|energy|${d}|${Math.round(250 + Math.random()*500)}`);
    lines.push(`D|exercise|${d}|${Math.round(10 + Math.random()*60)}`);
    lines.push(`D|rhr|${d}|${Math.round(55 + Math.random()*10)}`);
    if (i % 2 === 0) lines.push(`W|${['Running','Strength Training','Cycling','Walking'][(-i/2)%4]}|${d}T06:30|${Math.round(25+Math.random()*40)}|${Math.round(200+Math.random()*300)}|${(Math.random()*8).toFixed(2)}`);
  }
  ingest(lines.join('\n'));
};
$('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `vitamin-me-backup-${todayKey()}.json`; a.click();
};
$('btnImport').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s.days || !s.workouts) throw new Error('not a Vitamin Me backup');
    state = s; save(state); render(); toast('Backup restored');
  } catch(err){ toast('Import failed: ' + err.message, true); }
};
$('btnClear').onclick = () => {
  if (confirm('Delete all Vitamin Me data on this device?')){ state = blank(); save(state); render(); toast('Cleared'); }
};

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
